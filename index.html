<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowcaseApp DIY 作品展</title>
<script>
  /* 主题预解析：避免闪烁。手动选择 > 跟随系统 */
  (function(){
    var t = localStorage.getItem('zk-theme');
    if(t !== 'dark' && t !== 'light'){
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{
    --bg:#F4F4F2; --ink:#1B1B19; --grey:#6E6E68;
    --accent:#B7472A;
    --card:#FFFFFF; --media-bg:#E8E8E4;
    --cap-text:#3F3F3A; --meta:#7C7C75;
    --border:rgba(0,0,0,.07);
    --header-bg:rgba(244,244,242,.78);
    --hover-soft:rgba(27,27,25,.06); --dot:rgba(27,27,25,.28);
    --panel-bg:rgba(255,255,255,.55); --panel-border:rgba(255,255,255,.8); --panel-hl:rgba(255,255,255,.9);
    --shadow-post:0 1px 2px rgba(0,0,0,.05), 0 24px 60px -28px rgba(24,24,27,.35);
  }
  html[data-theme="dark"]{
    --bg:#141413; --ink:#EDEBE7; --grey:#9B9891;
    --accent:#D2755E;
    --card:#1E1D1B; --media-bg:#2A2926;
    --cap-text:#C9C6C0; --meta:#96938C;
    --border:rgba(255,255,255,.1);
    --header-bg:rgba(20,20,19,.78);
    --hover-soft:rgba(255,255,255,.08); --dot:rgba(255,255,255,.3);
    --panel-bg:rgba(255,255,255,.05); --panel-border:rgba(255,255,255,.12); --panel-hl:rgba(255,255,255,.16);
    --shadow-post:0 1px 2px rgba(0,0,0,.3), 0 24px 60px -28px rgba(0,0,0,.7);
  }
  /* 无 JS 时跟随系统 */
  @media (prefers-color-scheme: dark){
    html:not([data-theme]){
      --bg:#141413; --ink:#EDEBE7; --grey:#9B9891;
      --accent:#D2755E;
      --card:#1E1D1B; --media-bg:#2A2926;
      --cap-text:#C9C6C0; --meta:#96938C;
      --border:rgba(255,255,255,.1);
      --header-bg:rgba(20,20,19,.78);
      --hover-soft:rgba(255,255,255,.08); --dot:rgba(255,255,255,.3);
      --panel-bg:rgba(255,255,255,.05); --panel-border:rgba(255,255,255,.12); --panel-hl:rgba(255,255,255,.16);
      --shadow-post:0 1px 2px rgba(0,0,0,.3), 0 24px 60px -28px rgba(0,0,0,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.8; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .35s ease, color .35s ease;
  }
  a{color:inherit;}

  .rise{opacity:0; transform:translateY(18px); animation:rise .9s cubic-bezier(.22,.7,.25,1) forwards;}
  .rise.d1{animation-delay:.08s;} .rise.d2{animation-delay:.2s;} .rise.d3{animation-delay:.34s;}
  @keyframes rise{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none;}}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--header-bg); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border-bottom:1px solid var(--border);
  }
  .bar{max-width:1180px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; gap:18px;}
  .logo{font-size:19px; font-weight:700; letter-spacing:normal;}
  .sub{font-size:12px; color:var(--grey); letter-spacing:1.5px;}
  .bar a.nav{font-size:13px; color:var(--grey); text-decoration:none; padding:10px 4px; letter-spacing:.5px;}
  .bar a.nav:hover{color:var(--ink);}
  .bar .right{margin-left:auto; display:flex; align-items:center; gap:6px;}

  /* 深浅色切换 */
  .theme-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:var(--ink); cursor:pointer;
    display:grid; place-items:center;
    transition:background .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .theme-btn:hover{background:var(--hover-soft);}
  .theme-btn:active{transform:scale(.9) rotate(14deg);}
  .theme-btn svg{width:18px; height:18px; stroke:currentColor; stroke-width:1.8; fill:none;}
  .theme-btn .moon{display:none;}
  html[data-theme="dark"] .theme-btn .sun{display:none;}
  html[data-theme="dark"] .theme-btn .moon{display:block;}

  /* ---------- Hero ---------- */
  .hero{max-width:1180px; margin:0 auto; padding:56px 32px 18px;}
  .hero h1{
    font-size:clamp(20px,5.2vw,52px); font-weight:650; letter-spacing:1px; line-height:1.3;
    white-space:nowrap;
  }
  .hero p{margin-top:14px; color:var(--grey); font-size:14.5px; white-space:nowrap;}
  @media (max-width:860px){.hero p{white-space:normal;}}
  .hero .meta{margin-top:20px; display:flex; gap:28px; color:var(--grey); font-size:12px; letter-spacing:1.2px; flex-wrap:wrap;}
  .hero .meta:empty{display:none;}
  .hero .meta span{border-top:1px solid var(--ink); padding-top:8px; color:var(--ink);}

  /* BlurRevealText：逐词模糊浮现（blur 12 / stagger 60ms / 弹性回落） */
  .hero h1 .rvw{
    display:inline-block; white-space:pre;
    opacity:0; transform:translateY(.35em); filter:blur(12px);
    animation:rvIn .8s cubic-bezier(.2,.8,.25,1) forwards;
  }
  .hero h1 .rvw.accent{color:var(--accent);}
  @keyframes rvIn{to{opacity:1; transform:none; filter:blur(0);}}

  /* ---------- 作品：明信片帖子流 ---------- */
  .works{max-width:1180px; margin:0 auto; padding:52px 32px 26px;}
  .works-head{display:flex; align-items:baseline; gap:14px; margin-bottom:34px;}
  .works-head h2{font-size:17px; font-weight:650; letter-spacing:2px;}
  .works-head em{font-style:normal; font-size:11.5px; color:var(--grey); letter-spacing:1px;}
  /* 排序切换 */
  .sort-btn{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); border-radius:99px; background:transparent;
    color:var(--grey); font-size:11.5px; letter-spacing:.5px; padding:6px 13px; cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .sort-btn:hover{background:var(--hover-soft); color:var(--ink);}
  .sort-btn svg{width:13px; height:13px;}
  /* JS 分列瀑布流（规避 Safari 多列+transform 合成层不绘制的 bug） */
  .posts{
    display:flex; gap:28px; align-items:flex-start;
  }
  .post-col{
    flex:1; min-width:0;
    display:flex; flex-direction:column; gap:28px;
  }
  .posts .post{width:100%;}

  .post{
    width:100%; background:var(--card);
    border-radius:26px; overflow:hidden;
    box-shadow:var(--shadow-post);
    outline:1px solid var(--border);
  }

  /* 帖子头 */
  .post-head{display:flex; align-items:center; gap:11px; padding:12px 15px 11px;}
  .avatar{
    width:38px; height:38px; border-radius:50%; flex:none;
    background:conic-gradient(from 200deg, var(--accent), #C9A24A, #8A8578, var(--accent));
    padding:2px;
  }
  .avatar i{
    display:grid; place-items:center; width:100%; height:100%;
    border-radius:50%; background:var(--card); padding:2px; font-style:normal;
  }
  .av-emoji{
    width:100%; height:100%; border-radius:50%;
    display:grid; place-items:center; font-size:17px; line-height:1;
  }
  .post-head .who{min-width:0; flex:1;}
  .post-head .who p:first-child{font-size:14px; font-weight:650; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .post-head .who p:last-child{font-size:11.5px; color:var(--grey); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 媒体区：比例由素材决定（默认 4:5，逐张自适应） */
  .ig-media{
    position:relative; width:100%; aspect-ratio:4/5; overflow:hidden;
    background:var(--media-bg); touch-action:pan-y; user-select:none; -webkit-user-select:none;
    transition:aspect-ratio .32s cubic-bezier(.22,.7,.25,1);
  }
  /* track/媒体绝对定位填满：绕开 Safari 百分比高度不解析的 bug（图片会 0 高消失） */
  .ig-track{position:absolute; inset:0; display:flex; cursor:grab; will-change:transform;}
  .ig-track.dragging{cursor:grabbing;}
  .ig-slide{flex:0 0 100%; height:100%; position:relative;}
  .ig-slide img, .ig-slide video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .ig-slide video{pointer-events:auto;}
  .ig-slide .txt{
    position:absolute; left:0; right:0; bottom:0;
    padding:13px 16px; font-size:12.5px; line-height:1.75; color:#fff;
    background:linear-gradient(180deg, rgba(16,16,14,0), rgba(16,16,14,.55));
    pointer-events:none;
  }
  .sample{
    position:absolute; top:44px; left:12px; z-index:6;
    font-size:10px; letter-spacing:1.5px; color:#fff;
    background:rgba(20,20,18,.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:2px 9px;
  }

  /* 计数（右上角，仅数量） */
  .ig-count{
    position:absolute; top:22px; right:10px; z-index:7;
    display:flex; align-items:center; gap:5px;
    height:26px; padding:0 11px; border-radius:99px;
    background:rgba(20,20,18,.42); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:#fff; font-size:11px; font-weight:650; font-variant-numeric:tabular-nums;
  }

  /* 箭头 */
  .ig-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:8;
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.82); color:#1B1B19;
    display:grid; place-items:center; cursor:pointer;
    opacity:0; transition:opacity .2s ease, background .2s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.14);
  }
  .ig-arrow:hover{background:#fff;}
  .ig-arrow.prev{left:9px;} .ig-arrow.next{right:9px;}
  .ig-media:hover .ig-arrow, .ig-arrow:focus-visible{opacity:.9;}   /* 悬停左右同显 */
  @media (hover:none){.ig-arrow{opacity:.45;}}
  .ig-arrow svg{width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none;}

  /* 双击爱心 */
  .ig-heart-pop{
    position:absolute; z-index:9; width:86px; height:86px;
    transform:translate(-50%,-50%); pointer-events:none;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));
  }
  .ig-heart-pop svg{width:100%; height:100%; fill:#fff;}
  .ig-heart-pop.play{animation:heartPop .85s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes heartPop{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg); opacity:0;}
    38%{transform:translate(-50%,-50%) scale(1.22) rotate(6deg); opacity:1;}
    62%{transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1;}
    100%{transform:translate(-50%,-52%) scale(1.35) rotate(0deg); opacity:0;}
  }

  /* 视频：隐藏原生控件，左下播放/暂停、右下静音 */
  .ig-slide .v-btn{
    position:absolute; z-index:8;
    width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(20,20,18,.42); color:#fff;
    display:grid; place-items:center; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background .2s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .ig-slide .v-btn:hover{background:rgba(20,20,18,.62);}
  .ig-slide .v-btn:active{transform:scale(.9);}
  .ig-slide .v-btn svg{width:15px; height:15px; fill:currentColor;}
  .ig-slide .v-play{left:10px; bottom:12px;}
  .ig-slide .v-mute{right:10px; bottom:12px;}
  .ig-slide video{cursor:pointer;}
  /* 视频编码不支持时的友好提示（不黑屏死等） */
  .v-fail{
    position:absolute; inset:0; z-index:7;
    display:grid; place-items:center; text-align:center;
    background:rgba(20,20,18,.55); color:#fff;
    font-size:12px; line-height:1.9; padding:20px;
  }
  .v-fail a{color:#fff; text-underline-offset:3px; pointer-events:auto;}

  /* 点击图片放大（灯箱） */
  .ig-slide{cursor:zoom-in;}
  .ig-slide:has(video){cursor:grab;}
  .lightbox{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    padding:40px;
    background:rgba(12,12,11,.5);
    backdrop-filter:blur(22px) saturate(1.1); -webkit-backdrop-filter:blur(22px) saturate(1.1);
    opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility .3s ease;
  }
  .lightbox.on{opacity:1; visibility:visible;}
  .lightbox .lb-close{
    position:absolute; top:22px; right:22px;
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14); color:#fff;
    font-size:19px; line-height:1; cursor:pointer;
    display:grid; place-items:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background .2s ease;
  }
  .lightbox .lb-close:hover{background:rgba(255,255,255,.28);}
  .lightbox .lb-stage{position:relative; display:flex; align-items:center; justify-content:center;}
  .lightbox img, .lightbox video{
    max-width:min(92vw, 1080px); max-height:88vh;
    border-radius:14px; display:none;
    box-shadow:0 30px 90px rgba(0,0,0,.5);
    transform:scale(.94); opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.25,1), opacity .28s ease;
  }
  .lightbox img.on, .lightbox video.on{display:block; transform:scale(1); opacity:1;}
  .lightbox img{cursor:zoom-out;}
  .lb-play{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(20,20,18,.45); color:#fff;
    display:none; place-items:center; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .2s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .lb-play:hover{background:rgba(20,20,18,.65);}
  .lb-play:active{transform:translate(-50%,-50%) scale(.92);}
  .lb-play.show{display:grid;}
  .lb-play svg{width:24px; height:24px; fill:currentColor;}
  .lb-play .ic-pause{display:none;}
  .lb-play.playing .ic-play{display:none;}
  .lb-play.playing .ic-pause{display:block;}
  /* 灯箱静音开关（视频右下角） */
  .lb-sound{
    position:absolute; right:16px; bottom:16px;
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(20,20,18,.45); color:#fff;
    display:none; place-items:center; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .2s ease;
  }
  .lb-sound:hover{background:rgba(20,20,18,.65);}
  .lb-sound.show{display:grid;}
  .lb-sound svg{width:18px; height:18px; fill:currentColor;}
  .lb-sound .ic-on{display:none;}
  .lb-sound.sound-on .ic-off{display:none;}
  .lb-sound.sound-on .ic-on{display:block;}
  /* 播放中隐藏播放按钮（鼠标移开按钮后） */
  .lb-stage.playing .lb-play{opacity:0;}
  .lb-stage.playing:hover .lb-play{opacity:1;}
  .lightbox .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14); color:#fff;
    font-size:20px; line-height:1; cursor:pointer;
    display:grid; place-items:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background .2s ease, opacity .2s ease;
  }
  .lightbox .lb-nav:hover{background:rgba(255,255,255,.28);}
  .lightbox .lb-nav[hidden]{display:none;}
  .lightbox .lb-prev{left:22px;} .lightbox .lb-next{right:22px;}
  .lightbox .lb-cap{
    position:absolute; left:0; right:0; bottom:18px;
    text-align:center; color:rgba(255,255,255,.85);
    font-size:12.5px; letter-spacing:.5px;
  }

  /* 操作行 */
  .ig-actions{display:flex; align-items:center; padding:6px 8px 2px;}
  .ig-btn{
    width:42px; height:42px; border:0; border-radius:50%; background:transparent;
    display:grid; place-items:center; cursor:pointer; color:var(--ink);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease;
  }
  .ig-btn:hover{background:var(--hover-soft);}
  .ig-btn:active{transform:scale(.86);}
  .ig-btn svg{width:23px; height:23px; stroke:currentColor; stroke-width:1.8; fill:none;}
  .ig-btn.on{color:var(--accent);}
  .ig-btn.on svg{fill:currentColor;}
  .ig-btn.pop svg{animation:btnPop .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes btnPop{0%{transform:scale(.5);}100%{transform:scale(1);}}

  /* 点状分页器（向边缘缩小） */
  .ig-dots{flex:1; display:flex; align-items:center; justify-content:center; gap:5px;}
  .ig-dots i{
    width:5.5px; height:5.5px; border-radius:50%; background:var(--dot);
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), background .25s ease;
    transform:scale(.5);
  }

  /* 图文 */
  .ig-caption{padding:7px 16px 17px;}
  .ig-caption .likes{font-size:13.5px; font-weight:650; font-variant-numeric:tabular-nums;}
  .ig-caption .cap{margin-top:3px; font-size:13.5px; line-height:1.75; color:var(--cap-text);}
  .ig-caption .cap b{color:var(--ink); margin-right:6px;}
  .ig-caption h5{
    margin-top:13px; font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--meta);
    border-top:1px solid var(--border); padding-top:11px;
  }
  .ig-caption ul{margin-top:5px; list-style:none;}
  .ig-caption li{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; line-height:2.05; color:var(--cap-text);}
  .ig-caption li span:last-child{color:var(--meta); font-variant-numeric:tabular-nums;}

  /* ---------- 来源声明 ---------- */
  .source{max-width:1180px; margin:30px auto 0; padding:0 32px;}
  .source .panel{
    border-radius:18px; padding:36px 42px;
    background:var(--panel-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--panel-border);
    box-shadow:0 12px 36px rgba(0,0,0,.06), inset 0 1px 0 var(--panel-hl);
    display:flex; gap:30px; align-items:center; flex-wrap:wrap;
  }
  .source img{width:56px; height:56px; border-radius:12px; opacity:.9;}
  .source .txt{flex:1; min-width:260px;}
  .source h3{font-size:15px; font-weight:650; letter-spacing:1.5px;}
  .source p{margin-top:8px; font-size:13.5px; color:var(--cap-text); line-height:1.9;}
  .source a{color:var(--ink); text-underline-offset:3px;}
  .source .fine{margin-top:6px; font-size:11.5px; color:var(--meta);}

  footer{max-width:1180px; margin:0 auto; padding:44px 32px 56px; color:var(--meta); font-size:11.5px; letter-spacing:1px;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" id="s-title">ShowcaseApp DIY 作品展</div>
    <div class="sub" id="s-subtitle"></div>
    <div class="right">
      <a class="nav" href="#works">作品</a>
      <a class="nav" href="#source">关于</a>
      <button class="theme-btn" id="theme-toggle" aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6Z"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 class="rise" id="s-heroTitle"></h1>
  <p class="rise d1" id="s-heroDesc"></p>
  <div class="meta rise d2" id="s-heroTags"></div>
</section>

<section class="works" id="works">
  <div class="works-head">
    <h2>作品</h2>
    <em id="s-worksNote"></em>

      <svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

<!-- 图片/视频放大灯箱 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大查看">
  <button class="lb-close" id="lb-close" aria-label="关闭">×</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">‹</button>

      <svg class="ic-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
    </button>

      <svg class="ic-on" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.8 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

<script src="data/works.js"></script>
<script>
(function(){
  'use strict';
  var D = window.WORKS_DATA;
  if(!D){ document.body.innerHTML = '<p style="padding:40px">数据加载失败：data/works.js</p>'; return; }
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 文案注入（后台可改） */
  var S = D.site || {};
  function set(id, html){ var el = document.getElementById(id); if(el) el.innerHTML = html || ''; }
  set('s-title', S.title); set('s-subtitle', S.subtitle);
  set('s-heroTitle', S.heroTitle); set('s-heroDesc', S.heroDesc);
  set('s-worksNote', S.worksNote); set('s-sourceTitle', S.sourceTitle);
  set('s-sourceText', S.sourceText); set('s-sourceFine', S.sourceFine);
  set('s-footerText', S.footerText);
  /* 声明 + 站长联系方式 */
  (function(){
    var el = document.getElementById('s-contactLine');
    if(!el) return;
    var contact = (S.contact || '').trim();
    var line = '作品由社区投稿展示，如涉及肖像、隐私或版权问题，请联系站长删除。';
    if(contact) line += ' 联系方式：' + contact;
    el.innerHTML = esc(line);
  })();
  document.title = S.title || 'ShowcaseApp DIY 作品展';

  var tagsEl = document.getElementById('s-heroTags');
  (S.heroTags || '').split('|').filter(Boolean).forEach(function(t){
    var s = document.createElement('span'); s.textContent = t.trim(); tagsEl.appendChild(s);
  });

  /* ---------- 深浅色切换 ---------- */
  (function(){
    var btn = document.getElementById('theme-toggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('zk-theme', cur); }catch(e){}
    });
  })();

  /* ---------- 灯箱（图片 + 视频，多张循环翻页） ---------- */
  (function(){
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lb-img');
    var lbVideo = document.getElementById('lb-video');
    var lbPlay = document.getElementById('lb-play');
    var lbSound = document.getElementById('lb-sound');
    var lbStage = lb.querySelector('.lb-stage');
    var lbCap = document.getElementById('lb-cap');
    var lbPrev = document.getElementById('lb-prev');
    var lbNext = document.getElementById('lb-next');
    var list = [];      /* 当前帖子的全部素材（图片+视频） */
    var li = 0;

    function syncPlayIcon(){
      var playing = !lbVideo.paused && !lbVideo.ended;
      lbPlay.classList.toggle('playing', playing);
      lbStage.classList.toggle('playing', playing);
    }
    function syncSoundIcon(){
      lbSound.classList.toggle('sound-on', !lbVideo.muted);
    }
    function show(){
      var it = list[li];
      var isVideo = it.type === 'video';
      /* 切换时停掉上一个视频 */
      lbVideo.pause();
      lbImg.classList.toggle('on', !isVideo);
      lbVideo.classList.toggle('on', isVideo);
      lbPlay.classList.toggle('show', isVideo);
      lbSound.classList.toggle('show', isVideo);
      if(isVideo){
        if(lbVideo.src !== it.src){
          lbVideo.src = it.src; lbVideo.load();
          lbVideo.__coverDone = false; lbVideo.poster = '';   /* 换视频重抓首帧 */
          makeCover(lbVideo);
        }
        /* 不再强制静音：沿用当前声音状态（与小图一致，默认静音） */
        syncPlayIcon();
        syncSoundIcon();
      }else{
        lbImg.src = it.src;
        lbImg.alt = it.alt || '';
      }
      lbCap.textContent = (it.cap || '') + (list.length > 1 ? '  ·  ' + (li + 1) + '/' + list.length : '');
      var multi = list.length > 1;
      lbPrev.hidden = !multi; lbNext.hidden = !multi;
    }
    function openLB(items, start, cap){
      list = items;
      li = Math.max(0, Math.min(start, list.length - 1));
      show();
      lb.classList.add('on');
      document.body.style.overflow = 'hidden';
    }
    function step(d){ li = (li + d + list.length) % list.length; show(); }
    function closeLB(){
      lbVideo.pause();
      lb.classList.remove('on');
      document.body.style.overflow = '';
    }
    window.__openLB = openLB;
    document.getElementById('lb-close').addEventListener('click', closeLB);
    lbPrev.addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
    lbNext.addEventListener('click', function(e){ e.stopPropagation(); step(1); });
    lb.addEventListener('click', function(e){ if(e.target === lb || e.target === lbImg) closeLB(); });
    /* 灯箱视频：播放/暂停 */
    lbPlay.addEventListener('click', function(e){
      e.stopPropagation();
      if(lbVideo.paused) lbVideo.play(); else lbVideo.pause();
    });
    lbVideo.addEventListener('click', function(e){
      e.stopPropagation();
      if(lbVideo.paused) lbVideo.play(); else lbVideo.pause();
    });
    lbVideo.addEventListener('play', syncPlayIcon);
    lbVideo.addEventListener('pause', syncPlayIcon);
    /* 灯箱视频静音开关 */
    lbSound.addEventListener('click', function(e){
      e.stopPropagation();
      lbVideo.muted = !lbVideo.muted;
      syncSoundIcon();
    });
    document.addEventListener('keydown', function(e){
      if(!lb.classList.contains('on')) return;
      if(e.key === 'Escape') closeLB();
      else if(e.key === 'ArrowLeft') step(-1);
      else if(e.key === 'ArrowRight') step(1);
    });

    /* 单击素材 → 放大；与双击爱心、拖拽共存 */
    var clickTimer = null;
    document.getElementById('posts').addEventListener('click', function(e){
      var slide = e.target.closest ? e.target.closest('.ig-slide') : null;
      if(!slide && e.target.closest){
        /* 拖拽捕获后 click 落到 track 上：按当前位移推算可见张 */
        var tr = e.target.closest('.ig-track');
        if(tr){
          var m = /translateX\((-?[\d.]+)px\)/.exec(tr.style.transform || '');
          var w = tr.parentElement.clientWidth;
          var i = (m && w) ? Math.round(-parseFloat(m[1]) / w) : 0;
          slide = tr.children[Math.max(0, i)] || null;
        }
      }
      if(!slide || window.__suppressZoom){ return; }
      /* 视频按钮点击不进灯箱；图片/视频区域点击 → 进灯箱 */
      if(e.target.closest && e.target.closest('.v-btn')) return;
      var img = slide.querySelector('img');
      var vid = slide.querySelector('video');
      if(!img && !vid) return;
      if(clickTimer){ clearTimeout(clickTimer); clickTimer = null; return; }  /* 双击的第二击 */
      clickTimer = setTimeout(function(){
        clickTimer = null;
        if(window.__suppressZoom) return;
        var card = slide.closest('.post');
        var cap = card ? ((card.querySelector('.post-head .who p') || {}).textContent || '') : '';
        /* 收集该帖子的全部素材（含视频） */
        var items = [];
        var start = 0;
        card.querySelectorAll('.ig-slide').forEach(function(sl){
          var im = sl.querySelector('img');
          var vd = sl.querySelector('video');
          if(sl === slide) start = items.length;
          if(vd) items.push({ type: 'video', src: vd.src, cap: cap });
          else if(im) items.push({ type: 'image', src: im.src, alt: im.alt, cap: cap });
        });
        if(items.length) openLB(items, start, cap);
      }, 230);
    });
    /* 双击爱心触发时取消单击放大 */
    document.getElementById('posts').addEventListener('dblclick', function(){
      if(clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
    }, true);
  })();

  /* ---------- 随机头像（emoji 版：按作者名哈希取，同作者稳定、不同作者不同） ---------- */
  var EMOJI_POOL = ['🛠️','🔧','🪛','📷','🖼️','💡','⚡','🔌','📟','🕹️','🎨','🧩','🤖','💻','🖥️','⌨️','🎛️','🔋','🪵','🪟','🧊','🔭','📻','🎧','🪄','🌟','🚀','🧲','⚙️','🪤'];
  function avatarSVG(seed){
    var s = String(seed || '·'), h = 0;
    for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    var emoji = EMOJI_POOL[h % EMOJI_POOL.length];
    var hue = h % 360;
    return '<span class="av-emoji" style="background:hsl(' + hue + ',46%,72%)" aria-hidden="true">' + emoji + '</span>';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* 视频首帧封面（Safari/iOS 兼容）：解码首帧 → canvas 截图 → 设为 poster */
  function makeCover(v){
    if(!v || v.__coverDone) return;
    function snap(){
      try{
        if(!v.videoWidth) return;
        var c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        v.poster = c.toDataURL('image/jpeg', 0.82);
        v.__coverDone = true;
      }catch(e){ /* 跨域视频抓不了帧，保留 #t 封面 */ }
    }
    v.addEventListener('loadeddata', function(){
      if(v.__coverDone) return;
      if(v.currentTime < 0.01){
        v.addEventListener('seeked', snap, { once: true });
        try{ v.currentTime = 0.05; }catch(e){ snap(); }
      }else snap();
    });
    if(v.readyState >= 2) snap();
  }

  /* 视频编码不支持（如老设备放不了 HEVC）→ 友好提示 + 下载链接 */
  function showVideoFail(slide, v){
    if(!slide || slide.querySelector('.v-fail')) return;
    var d = document.createElement('div');
    d.className = 'v-fail';
    d.innerHTML = '<div>此视频编码不受当前浏览器支持<br>（HEVC/H.265 等格式需要较新设备）<br>' +
      '<a href="' + esc(v.getAttribute('src') || '') + '" download>下载观看</a></div>';
    slide.appendChild(d);
  }

  var SVG = {
    heart:'<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
    bookmark:'<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>',
    left:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
    right:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
    soundOn:'<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.8 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOff:'<svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  /* ================= 点赞计数（第三方免费计数服务） ================= */
  var COUNT_API = 'https://countapi.mileshilliard.com/api/v1';
  function likeKey(w){
    var s = String(w.title || '') + '|' + String(w.author || ''), h = 0;
    for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return 'zk-like-' + h.toString(36) + '-' + s.length;
  }
  function countGet(key){
    return fetch(COUNT_API + '/get/' + key).then(function(r){ return r.json(); })
      .then(function(j){ return typeof j.value === 'number' ? j.value : null; }).catch(function(){ return null; });
  }
  function countHit(key){
    return fetch(COUNT_API + '/hit/' + key).then(function(r){ return r.json(); })
      .then(function(j){ return typeof j.value === 'number' ? j.value : null; }).catch(function(){ return null; });
  }
  function countSet(key, v){
    return fetch(COUNT_API + '/set/' + key + '?value=' + v).then(function(r){ return r.json(); })
      .then(function(j){ return typeof j.value === 'number' ? j.value : null; }).catch(function(){ return null; });
  }
  /* 页面加载即拉取各作品当前点赞数 */
  function loadLikeCounts(){
    document.querySelectorAll('.cnt[data-key]').forEach(function(el){
      countGet(el.dataset.key).then(function(v){ if(v !== null) el.textContent = String(v); });
    });
  }

  /* ================= 渲染帖子 ================= */
  var wrap = document.getElementById('posts');
  var sortDesc = false;
  function renderPosts(){
    wrap.innerHTML = '';
    /* 按视口宽建列：桌面 3 列 / 平板 2 列 / 手机 1 列 */
    var nCols = window.innerWidth > 860 ? 3 : (window.innerWidth > 560 ? 2 : 1);
    var cols = [];
    for(var ci = 0; ci < nCols; ci++){
      var col = document.createElement('div');
      col.className = 'post-col';
      wrap.appendChild(col);
      cols.push({ el: col, h: 0 });
    }
    var list = (D.works || []).slice();
    if(sortDesc) list.reverse();
    list.forEach(function(w, wi){
    var media = (w.media && w.media.length) ? w.media : [];
    var n = Math.max(1, media.length);

    var slidesHTML = media.map(function(m){
      if(m.type === 'video'){
        /* #t=0.001：让浏览器解码首帧作为封面显示 */
        var vsrc = esc(m.src) + (String(m.src).indexOf('#') === -1 ? '#t=0.001' : '');
        return '<div class="ig-slide"><video src="' + vsrc + '" muted preload="metadata" playsinline></video>' +
          '<button class="v-btn v-play" aria-label="播放/暂停">' + SVG.play + '</button>' +
          '<button class="v-btn v-mute" aria-label="切换声音">' + SVG.soundOff + '</button></div>';
      }
      if(m.type === 'text'){
        return '<div class="ig-slide"><img src="' + esc(m.src) + '" alt="' + esc(m.alt || w.title) + '"><div class="txt">' + esc(m.text || '') + '</div></div>';
      }
      return '<div class="ig-slide"><img src="' + esc(m.src) + '" alt="' + esc(m.alt || w.title) + '" draggable="false"></div>';
    }).join('');

    var dotsHTML = media.map(function(_, i){ return '<i></i>'; }).join('');
    var bomHTML = (w.bom || []).map(function(b){
      return '<li><span>' + esc(b.name) + '</span><span>' + esc(b.qty) + '</span></li>';
    }).join('');
    var initials = String(w.author || w.title || '·').split(/\s+/).map(function(x){ return x[0]; }).slice(0, 2).join('');
    var avatar = avatarSVG(w.author || w.title || '·');

    var el = document.createElement('article');
    el.className = 'post rise d' + Math.min(wi + 1, 3);
    el.innerHTML =
      '<header class="post-head">' +
        '<span class="avatar"><i>' + avatar + '</i></span>' +
        '<div class="who"><p>' + esc(w.author || '匿名') + '</p><p>' + esc(w.title) + (w.form ? ' · ' + esc(w.form) : '') + (w.id ? ' · ' + esc(w.id) : '') + (w.sample === true ? ' · 示例' : '') + '</p></div>' +
      '</header>' +
      '<div class="ig-media" tabindex="0" role="region" aria-roledescription="carousel" aria-label="' + esc(w.title) + '：' + n + ' 张素材，左右方向键切换">' +
        '<div class="ig-track">' + slidesHTML + '</div>' +
        '<div class="ig-count"><span class="num">1/' + n + '</span></div>' +
        (n > 1 ? '<button class="ig-arrow prev" aria-label="上一张">' + SVG.left + '</button><button class="ig-arrow next" aria-label="下一张">' + SVG.right + '</button>' : '') +
      '</div>' +
      '<div class="ig-actions">' +
        '<button class="ig-btn like" aria-label="喜欢" aria-pressed="false">' + SVG.heart + '</button>' +
        '<div class="ig-dots">' + dotsHTML + '</div>' +
        '<button class="ig-btn save" aria-label="收藏" aria-pressed="false">' + SVG.bookmark + '</button>' +
      '</div>' +
      '<div class="ig-caption">' +
        '<div class="likes"><span class="cnt" data-key="' + esc(likeKey(w)) + '">' + (w.likes || 0) + '</span> 次喜欢</div>' +
        '<p class="cap"><b>' + esc(w.title) + '</b>' + esc(w.desc) + '</p>' +
        (bomHTML ? '<h5>硬件清单</h5><ul>' + bomHTML + '</ul>' : '') +
      '</div>';

    /* 放进当前最短列（瀑布流贴紧） */
    var target = cols[0];
    for(var k = 1; k < cols.length; k++){ if(cols[k].h < target.h) target = cols[k]; }
    target.el.appendChild(el);
    initPost(el, w, media, n);
    target.h = target.el.scrollHeight;    /* 量真实高度（含图比例） */
    });
  }
  renderPosts();
  loadLikeCounts();

  /* 视口跨断点时重新分列（列数 3/2/1） */
  var rzTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){
      var want = window.innerWidth > 860 ? 3 : (window.innerWidth > 560 ? 2 : 1);
      if(wrap.querySelectorAll('.post-col').length !== want){ renderPosts(); loadLikeCounts(); }
    }, 250);
  });

  /* 排序切换：正序 ⇄ 倒序 */
  (function(){
    var btn = document.getElementById('sort-btn');
    var label = document.getElementById('sort-label');
    if(!btn) return;
    btn.addEventListener('click', function(){
      sortDesc = !sortDesc;
      label.textContent = sortDesc ? '倒序' : '正序';
      renderPosts();
      loadLikeCounts();
    });
  })();

  /* ================= 帖子交互 ================= */
  function initPost(el, w, media, n){
    var mediaBox = el.querySelector('.ig-media');
    var track = el.querySelector('.ig-track');
    var dots = el.querySelectorAll('.ig-dots i');
    var num = el.querySelector('.ig-count .num');
    var likeBtn = el.querySelector('.like');
    var saveBtn = el.querySelector('.save');
    var cnt = el.querySelector('.cnt');
    var idx = 0, width = 0;
    var dragging = false, startX = 0, startOff = 0, lastX = 0, lastT = 0, vel = 0, panned = false;
    var x = 0, raf = null, animX = 0, animV = 0, animTarget = 0;
    var liked = false, saved = false;

    function measure(){ width = mediaBox.clientWidth; setX(-idx * width); }
    measure();
    window.addEventListener('resize', measure);

    function setX(px){ x = px; track.style.transform = 'translateX(' + px + 'px)'; }

    /* 弹簧（stiffness 320 / damping 26 / mass 0.8） */
    function springTo(target){
      animTarget = target;
      if(REDUCED){ setX(target); return; }
      if(raf) cancelAnimationFrame(raf);
      animX = x; animV = 0;
      var last = performance.now();
      (function step(now){
        var dt = Math.min((now - last) / 1000, 1 / 30); last = now;
        var acc = (-320 * (animX - animTarget) - 26 * animV) / 0.8;
        animV += acc * dt; animX += animV * dt;
        setX(animX);
        if(Math.abs(animX - animTarget) < 0.4 && Math.abs(animV) < 8){
          setX(animTarget); raf = null; return;
        }
        raf = requestAnimationFrame(step);
      })(last);
    }

    /* 状态同步 */
    function render(){
      num.textContent = (idx + 1) + '/' + n;
      dots.forEach(function(d, i){
        var dist = Math.abs(i - idx);
        var sc = dist === 0 ? 1.2 : dist === 1 ? .9 : dist === 2 ? .7 : .5;
        d.style.transform = 'scale(' + sc + ')';
        d.style.background = dist === 0 ? 'var(--accent)' : 'var(--dot)';
      });
      var prevA = el.querySelector('.ig-arrow.prev'), nextA = el.querySelector('.ig-arrow.next');
      if(prevA) prevA.classList.toggle('on', true);
      if(nextA) nextA.classList.toggle('on', true);
    }

    function go(to){
      idx = ((to % n) + n) % n;          /* 循环 */
      springTo(-idx * width);
      render();
      applyRatio(idx);                    /* 画框跟随当前张比例 */
    }

    /* ---- 视频：播放/暂停（左下）＋静音开关（右下），默认静音不自动播 ---- */
    el.querySelectorAll('.ig-slide video').forEach(function(v){
      var slide = v.parentElement;
      var playBtn = slide.querySelector('.v-play');
      var muteBtn = slide.querySelector('.v-mute');
      /* Safari/iOS 不认 #t 封面：canvas 抓首帧生成 poster */
      makeCover(v);
      /* 编码不支持（error 事件）→ 提示替代黑屏 */
      v.addEventListener('error', function(){ showVideoFail(slide, v); });
      function syncPlay(){ if(playBtn) playBtn.innerHTML = v.paused ? SVG.play : SVG.pause; }
      function syncMute(){ if(muteBtn){ muteBtn.innerHTML = v.muted ? SVG.soundOff : SVG.soundOn; } }
      syncPlay(); syncMute();
      if(playBtn) playBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(v.paused){ var p = v.play(); if(p && p.catch) p.catch(function(){ showVideoFail(slide, v); }); }
        else v.pause();
        syncPlay();
      });
      v.addEventListener('play', syncPlay);
      v.addEventListener('pause', syncPlay);
      if(muteBtn) muteBtn.addEventListener('click', function(e){
        e.stopPropagation();
        v.muted = !v.muted;
        syncMute();
        muteBtn.setAttribute('aria-label', v.muted ? '打开声音' : '静音');
      });
    });

    /* ---- 画框比例：横版固定 4:3，竖版固定 3:4 ---- */
    var ratioBox = el.querySelector('.ig-media');
    var ratioCache = {};
    function measureSlide(i){
      if(ratioCache[i]) return ratioCache[i];
      var sl = el.querySelectorAll('.ig-slide')[i];
      if(!sl) return null;
      var m = sl.querySelector('img, video');
      var w = m ? (m.naturalWidth || m.videoWidth) : 0;
      var h = m ? (m.naturalHeight || m.videoHeight) : 0;
      if(w && h){ ratioCache[i] = (w >= h) ? '4 / 3' : '3 / 4'; return ratioCache[i]; }
      return null;
    }
    function applyRatio(i){
      var r = measureSlide(i);
      if(r) ratioBox.style.aspectRatio = r;
    }
    /* 逐张测量（图片/视频加载完成后） */
    el.querySelectorAll('.ig-slide').forEach(function(sl, i){
      var img = sl.querySelector('img');
      var vid = sl.querySelector('video');
      if(img && !img.complete) img.addEventListener('load', function(){ delete ratioCache[i]; if(i === idx) applyRatio(i); });
      if(vid) vid.addEventListener('loadedmetadata', function(){ delete ratioCache[i]; if(i === idx) applyRatio(i); });
    });
    applyRatio(0);

    /* ---- 拖拽（弹簧回弹；触摸友好：窗口级监听＋轴向锁） ---- */
    var startY = 0, axis = null, gestureT0 = 0;
    function onDragMove(e){
      if(!dragging) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(!axis){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
        if(axis === 'y'){           /* 竖向手势：让页面正常滚动，放弃拖拽 */
          dragging = false;
          track.classList.remove('dragging');
          springTo(startOff);
          return;
        }
      }
      if(Math.abs(dx) > 4) panned = true;
      var edge = (idx === 0 && dx > 0) || (idx === n - 1 && dx < 0);
      setX(startOff + dx * (edge ? 0.3 : 1));          /* 越界阻尼 */
      var now = performance.now();
      if(now - lastT > 4){ vel = (e.clientX - lastX) / (now - lastT) * 1000; lastX = e.clientX; lastT = now; }
    }
    function endDrag(commit){
      if(!dragging) return;
      dragging = false;
      axis = null;
      track.classList.remove('dragging');
      window.removeEventListener('pointermove', onDragMove);
      window.removeEventListener('pointerup', onDragUp);
      window.removeEventListener('pointercancel', onDragCancel);
      var dx = x - startOff;
      if(panned){ window.__suppressZoom = true; setTimeout(function(){ window.__suppressZoom = false; }, 320); }
      /* 位移为主判据；速度仅在手势持续 >60ms 时可信（防瞬时抖动误判） */
      var velOk = (performance.now() - gestureT0) > 60;
      if(commit && (dx < -width * 0.18 || (velOk && vel < -500))) go(idx + 1);
      else if(commit && (dx > width * 0.18 || (velOk && vel > 500))) go(idx - 1);
      else springTo(-idx * width);
      setTimeout(function(){ panned = false; }, 0);
    }
    function onDragUp(){ endDrag(true); }
    function onDragCancel(){ endDrag(false); }   /* 系统接管手势（如滚动）→ 回弹不翻页 */
    track.addEventListener('pointerdown', function(e){
      if(e.target.tagName === 'VIDEO') return;
      if(e.target.closest && e.target.closest('.v-btn')) return;   /* 视频按钮不启动拖拽 */
      dragging = true; panned = false; axis = null;
      startX = lastX = e.clientX; startY = e.clientY;
      startOff = -idx * width; vel = 0; lastT = gestureT0 = performance.now();
      track.classList.add('dragging');
      if(raf){ cancelAnimationFrame(raf); raf = null; }
      try{ track.setPointerCapture(e.pointerId); }catch(err){}
      /* 窗口级监听：iOS 触摸拖出元素也不丢事件 */
      window.addEventListener('pointermove', onDragMove);
      window.addEventListener('pointerup', onDragUp);
      window.addEventListener('pointercancel', onDragCancel);
    });

    /* ---- 双击爱心 ---- */
    mediaBox.addEventListener('dblclick', function(e){
      if(panned || e.target.tagName === 'VIDEO') return;
      var r = mediaBox.getBoundingClientRect();
      var pop = document.createElement('div');
      pop.className = 'ig-heart-pop';
      pop.style.left = (e.clientX - r.left) + 'px';
      pop.style.top = (e.clientY - r.top) + 'px';
      pop.innerHTML = SVG.heart;
      mediaBox.appendChild(pop);
      requestAnimationFrame(function(){ pop.classList.add('play'); });
      setTimeout(function(){ pop.remove(); }, 900);
      setLike(true);
    });

    /* ---- 爱心/收藏（点赞数同步第三方计数服务） ---- */
    var likeBusy = false;
    function setLike(v){
      if(liked === v || likeBusy) return;
      liked = v;
      likeBtn.classList.toggle('on', liked);
      likeBtn.classList.add('pop');
      likeBtn.setAttribute('aria-pressed', String(liked));
      setTimeout(function(){ likeBtn.classList.remove('pop'); }, 340);
      /* 乐观更新 + 远程同步 */
      var cur = parseInt(cnt.textContent, 10) || 0;
      cnt.textContent = String(Math.max(0, cur + (liked ? 1 : -1)));
      var key = cnt.dataset.key;
      if(!key) return;
      likeBusy = true;
      var done = function(v2){ if(v2 !== null) cnt.textContent = String(v2); likeBusy = false; };
      if(liked){ countHit(key).then(done); }
      else{
        countGet(key).then(function(v2){
          if(v2 === null){ likeBusy = false; return; }
          return countSet(key, Math.max(0, v2 - 1)).then(done);
        });
      }
    }
    likeBtn.addEventListener('click', function(){ setLike(!liked); });
    saveBtn.addEventListener('click', function(){
      saved = !saved;
      saveBtn.classList.toggle('on', saved);
      saveBtn.classList.add('pop');
      saveBtn.setAttribute('aria-pressed', String(saved));
      setTimeout(function(){ saveBtn.classList.remove('pop'); }, 340);
    });

    /* ---- 箭头 / 键盘 ---- */
    var prevBtn = el.querySelector('.ig-arrow.prev'), nextBtn = el.querySelector('.ig-arrow.next');
    if(prevBtn) prevBtn.addEventListener('click', function(){ go(idx - 1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ go(idx + 1); });
    mediaBox.addEventListener('keydown', function(e){
      if(e.key === 'ArrowRight'){ go(idx + 1); e.preventDefault(); }
      else if(e.key === 'ArrowLeft'){ go(idx - 1); e.preventDefault(); }
      else if(e.key === 'Home'){ go(0); e.preventDefault(); }
      else if(e.key === 'End'){ go(n - 1); e.preventDefault(); }
    });

    /* ---- 自动播放已按需求取消：图片右上角仅显示数量 ---- */

    render();
  }
})();
</script>
</body>
</html>
