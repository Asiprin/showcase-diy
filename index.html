<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowcaseApp DIY 作品展</title>
<script>
  /* 主题预解析：避免闪烁。手动选择 > 跟随系统 */
  (function(){
    var t = localStorage.getItem('zk-theme');
    if(t !== 'dark' && t !== 'light'){
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{
    --bg:#F4F4F2; --ink:#1B1B19; --grey:#6E6E68;
    --accent:#B7472A;
    --card:#FFFFFF; --media-bg:#E8E8E4;
    --cap-text:#3F3F3A; --meta:#7C7C75;
    --border:rgba(0,0,0,.07);
    --header-bg:rgba(244,244,242,.78);
    --hover-soft:rgba(27,27,25,.06); --dot:rgba(27,27,25,.28);
    --panel-bg:rgba(255,255,255,.55); --panel-border:rgba(255,255,255,.8); --panel-hl:rgba(255,255,255,.9);
    --shadow-post:0 1px 2px rgba(0,0,0,.05), 0 24px 60px -28px rgba(24,24,27,.35);
  }
  html[data-theme="dark"]{
    --bg:#141413; --ink:#EDEBE7; --grey:#9B9891;
    --accent:#D2755E;
    --card:#1E1D1B; --media-bg:#2A2926;
    --cap-text:#C9C6C0; --meta:#96938C;
    --border:rgba(255,255,255,.1);
    --header-bg:rgba(20,20,19,.78);
    --hover-soft:rgba(255,255,255,.08); --dot:rgba(255,255,255,.3);
    --panel-bg:rgba(255,255,255,.05); --panel-border:rgba(255,255,255,.12); --panel-hl:rgba(255,255,255,.16);
    --shadow-post:0 1px 2px rgba(0,0,0,.3), 0 24px 60px -28px rgba(0,0,0,.7);
  }
  /* 无 JS 时跟随系统 */
  @media (prefers-color-scheme: dark){
    html:not([data-theme]){
      --bg:#141413; --ink:#EDEBE7; --grey:#9B9891;
      --accent:#D2755E;
      --card:#1E1D1B; --media-bg:#2A2926;
      --cap-text:#C9C6C0; --meta:#96938C;
      --border:rgba(255,255,255,.1);
      --header-bg:rgba(20,20,19,.78);
      --hover-soft:rgba(255,255,255,.08); --dot:rgba(255,255,255,.3);
      --panel-bg:rgba(255,255,255,.05); --panel-border:rgba(255,255,255,.12); --panel-hl:rgba(255,255,255,.16);
      --shadow-post:0 1px 2px rgba(0,0,0,.3), 0 24px 60px -28px rgba(0,0,0,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.8; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .35s ease, color .35s ease;
  }
  a{color:inherit;}

  .rise{opacity:0; transform:translateY(18px); animation:rise .9s cubic-bezier(.22,.7,.25,1) forwards;}
  .rise.d1{animation-delay:.08s;} .rise.d2{animation-delay:.2s;} .rise.d3{animation-delay:.34s;}
  @keyframes rise{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none;}}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--header-bg); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border-bottom:1px solid var(--border);
  }
  .bar{max-width:1180px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; gap:18px;}
  .logo{font-size:19px; font-weight:700; letter-spacing:4px;}
  .sub{font-size:12px; color:var(--grey); letter-spacing:1.5px;}
  .bar a.nav{font-size:13px; color:var(--grey); text-decoration:none; padding:10px 4px; letter-spacing:.5px;}
  .bar a.nav:hover{color:var(--ink);}
  .bar .right{margin-left:auto; display:flex; align-items:center; gap:6px;}

  /* 深浅色切换 */
  .theme-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:var(--ink); cursor:pointer;
    display:grid; place-items:center;
    transition:background .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .theme-btn:hover{background:var(--hover-soft);}
  .theme-btn:active{transform:scale(.9) rotate(14deg);}
  .theme-btn svg{width:18px; height:18px; stroke:currentColor; stroke-width:1.8; fill:none;}
  .theme-btn .moon{display:none;}
  html[data-theme="dark"] .theme-btn .sun{display:none;}
  html[data-theme="dark"] .theme-btn .moon{display:block;}

  /* ---------- Hero ---------- */
  .hero{max-width:1180px; margin:0 auto; padding:56px 32px 18px;}
  .hero h1{
    font-size:clamp(20px,5.2vw,52px); font-weight:650; letter-spacing:1px; line-height:1.3;
    white-space:nowrap;
  }
  .hero p{margin-top:14px; color:var(--grey); font-size:14.5px; white-space:nowrap;}
  @media (max-width:860px){.hero p{white-space:normal;}}
  .hero .meta{margin-top:20px; display:flex; gap:28px; color:var(--grey); font-size:12px; letter-spacing:1.2px; flex-wrap:wrap;}
  .hero .meta:empty{display:none;}
  .hero .meta span{border-top:1px solid var(--ink); padding-top:8px; color:var(--ink);}

  /* BlurRevealText：逐词模糊浮现（blur 12 / stagger 60ms / 弹性回落） */
  .hero h1 .rvw{
    display:inline-block; white-space:pre;
    opacity:0; transform:translateY(.35em); filter:blur(12px);
    animation:rvIn .8s cubic-bezier(.2,.8,.25,1) forwards;
  }
  .hero h1 .rvw.accent{color:var(--accent);}
  @keyframes rvIn{to{opacity:1; transform:none; filter:blur(0);}}

  /* ---------- 作品：明信片帖子流 ---------- */
  .works{max-width:1180px; margin:0 auto; padding:52px 32px 26px;}
  .works-head{display:flex; align-items:baseline; gap:14px; margin-bottom:34px;}
  .works-head h2{font-size:17px; font-weight:650; letter-spacing:2px;}
  .works-head em{font-style:normal; font-size:11.5px; color:var(--grey); letter-spacing:1px;}
  .posts{
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:28px; align-items:start;
  }
  @media (max-width:860px){.posts{grid-template-columns:repeat(2, 1fr);}}
  @media (max-width:560px){.posts{grid-template-columns:1fr;}}

  .post{
    width:100%; background:var(--card);
    border-radius:26px; overflow:hidden;
    box-shadow:var(--shadow-post);
    outline:1px solid var(--border);
  }

  /* 帖子头 */
  .post-head{display:flex; align-items:center; gap:11px; padding:12px 15px 11px;}
  .avatar{
    width:38px; height:38px; border-radius:50%; flex:none;
    background:conic-gradient(from 200deg, var(--accent), #C9A24A, #8A8578, var(--accent));
    padding:2px;
  }
  .avatar i{
    display:grid; place-items:center; width:100%; height:100%;
    border-radius:50%; background:var(--card); padding:2px; font-style:normal;
  }
  .avatar b{
    display:grid; place-items:center; width:100%; height:100%;
    border-radius:50%; color:#fff; font-size:11.5px; letter-spacing:.5px;
    background:linear-gradient(135deg, #7E3524, var(--accent));
  }
  .post-head .who{min-width:0; flex:1;}
  .post-head .who p:first-child{font-size:14px; font-weight:650; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .post-head .who p:last-child{font-size:11.5px; color:var(--grey); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 媒体区：比例由素材决定（默认 4:5，JS 按首个素材的宽高覆盖） */
  .ig-media{
    position:relative; width:100%; aspect-ratio:4/5; overflow:hidden;
    background:var(--media-bg); touch-action:pan-y; user-select:none; -webkit-user-select:none;
  }
  .ig-track{display:flex; height:100%; cursor:grab;}
  .ig-track.dragging{cursor:grabbing;}
  .ig-slide{flex:0 0 100%; height:100%; position:relative;}
  .ig-slide img, .ig-slide video{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .ig-slide video{pointer-events:auto;}
  .ig-slide .txt{
    position:absolute; left:0; right:0; bottom:0;
    padding:13px 16px; font-size:12.5px; line-height:1.75; color:#fff;
    background:linear-gradient(180deg, rgba(16,16,14,0), rgba(16,16,14,.55));
    pointer-events:none;
  }
  .sample{
    position:absolute; top:44px; left:12px; z-index:6;
    font-size:10px; letter-spacing:1.5px; color:#fff;
    background:rgba(20,20,18,.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:2px 9px;
  }

  /* 分段进度条 */
  .ig-segs{
    position:absolute; inset:10px 11px auto; z-index:7;
    display:flex; gap:3.5px; pointer-events:none;
  }
  .ig-segs .seg{flex:1; height:3px; border-radius:99px; background:rgba(255,255,255,.35); overflow:hidden;}
  .ig-segs .seg i{display:block; height:100%; width:100%; border-radius:99px; background:#fff; transform:scaleX(0); transform-origin:left;}

  /* 计数/暂停 */
  .ig-count{
    position:absolute; top:22px; right:10px; z-index:7;
    display:flex; align-items:center; gap:5px;
    height:26px; padding:0 4px 0 10px; border-radius:99px;
    background:rgba(20,20,18,.42); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:#fff; font-size:11px; font-weight:650; font-variant-numeric:tabular-nums;
  }
  .ig-count button{
    width:22px; height:22px; border:0; border-radius:50%; background:transparent; color:#fff;
    display:grid; place-items:center; cursor:pointer;
  }
  .ig-count button:hover{background:rgba(255,255,255,.18);}
  .ig-count svg{width:11px; height:11px; fill:currentColor;}

  /* 箭头 */
  .ig-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:8;
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.82); color:#1B1B19;
    display:grid; place-items:center; cursor:pointer;
    opacity:0; transition:opacity .2s ease, background .2s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.14);
  }
  .ig-arrow:hover{background:#fff;}
  .ig-arrow.prev{left:9px;} .ig-arrow.next{right:9px;}
  .ig-media:hover .ig-arrow.on, .ig-arrow:focus-visible{opacity:.9;}
  @media (hover:none){.ig-arrow.on{opacity:.55;}}
  .ig-arrow svg{width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none;}

  /* 双击爱心 */
  .ig-heart-pop{
    position:absolute; z-index:9; width:86px; height:86px;
    transform:translate(-50%,-50%); pointer-events:none;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));
  }
  .ig-heart-pop svg{width:100%; height:100%; fill:#fff;}
  .ig-heart-pop.play{animation:heartPop .85s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes heartPop{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg); opacity:0;}
    38%{transform:translate(-50%,-50%) scale(1.22) rotate(6deg); opacity:1;}
    62%{transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1;}
    100%{transform:translate(-50%,-52%) scale(1.35) rotate(0deg); opacity:0;}
  }

  /* 操作行 */
  .ig-actions{display:flex; align-items:center; padding:6px 8px 2px;}
  .ig-btn{
    width:42px; height:42px; border:0; border-radius:50%; background:transparent;
    display:grid; place-items:center; cursor:pointer; color:var(--ink);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease;
  }
  .ig-btn:hover{background:var(--hover-soft);}
  .ig-btn:active{transform:scale(.86);}
  .ig-btn svg{width:23px; height:23px; stroke:currentColor; stroke-width:1.8; fill:none;}
  .ig-btn.on{color:var(--accent);}
  .ig-btn.on svg{fill:currentColor;}
  .ig-btn.pop svg{animation:btnPop .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes btnPop{0%{transform:scale(.5);}100%{transform:scale(1);}}

  /* 点状分页器（向边缘缩小） */
  .ig-dots{flex:1; display:flex; align-items:center; justify-content:center; gap:5px;}
  .ig-dots i{
    width:5.5px; height:5.5px; border-radius:50%; background:var(--dot);
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), background .25s ease;
    transform:scale(.5);
  }

  /* 图文 */
  .ig-caption{padding:7px 16px 17px;}
  .ig-caption .likes{font-size:13.5px; font-weight:650; font-variant-numeric:tabular-nums;}
  .ig-caption .cap{margin-top:3px; font-size:13.5px; line-height:1.75; color:var(--cap-text);}
  .ig-caption .cap b{color:var(--ink); margin-right:6px;}
  .ig-caption h5{
    margin-top:13px; font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--meta);
    border-top:1px solid var(--border); padding-top:11px;
  }
  .ig-caption ul{margin-top:5px; list-style:none;}
  .ig-caption li{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; line-height:2.05; color:var(--cap-text);}
  .ig-caption li span:last-child{color:var(--meta); font-variant-numeric:tabular-nums;}

  /* ---------- 来源声明 ---------- */
  .source{max-width:1180px; margin:30px auto 0; padding:0 32px;}
  .source .panel{
    border-radius:18px; padding:36px 42px;
    background:var(--panel-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--panel-border);
    box-shadow:0 12px 36px rgba(0,0,0,.06), inset 0 1px 0 var(--panel-hl);
    display:flex; gap:30px; align-items:center; flex-wrap:wrap;
  }
  .source img{width:56px; height:56px; border-radius:12px; opacity:.9;}
  .source .txt{flex:1; min-width:260px;}
  .source h3{font-size:15px; font-weight:650; letter-spacing:1.5px;}
  .source p{margin-top:8px; font-size:13.5px; color:var(--cap-text); line-height:1.9;}
  .source a{color:var(--ink); text-underline-offset:3px;}
  .source .fine{margin-top:6px; font-size:11.5px; color:var(--meta);}

  footer{max-width:1180px; margin:0 auto; padding:44px 32px 56px; color:var(--meta); font-size:11.5px; letter-spacing:1px;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" id="s-title">ShowcaseApp DIY 作品展</div>
    <div class="sub" id="s-subtitle"></div>
    <div class="right">
      <a class="nav" href="#works">作品</a>
      <a class="nav" href="#source">关于</a>
      <button class="theme-btn" id="theme-toggle" aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6Z"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 class="rise" id="s-heroTitle"></h1>
  <p class="rise d1" id="s-heroDesc"></p>
  <div class="meta rise d2" id="s-heroTags"></div>
</section>

<section class="works" id="works">
  <div class="works-head">
    <h2>作品</h2>
    <em id="s-worksNote"></em>
  </div>
  <div class="posts" id="posts"></div>
</section>

<section class="source" id="source">
  <div class="panel">
    <img src="assets/showcase-logo.png" alt="ShowcaseApp 标志">
    <div class="txt">
      <h3 id="s-sourceTitle"></h3>
      <p id="s-sourceText"></p>
      <p class="fine" id="s-sourceFine"></p>
    </div>
  </div>
</section>

<footer id="s-footerText"></footer>

<script src="data/works.js"></script>
<script>
(function(){
  'use strict';
  var D = window.WORKS_DATA;
  if(!D){ document.body.innerHTML = '<p style="padding:40px">数据加载失败：data/works.js</p>'; return; }
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 文案注入（后台可改） */
  var S = D.site || {};
  function set(id, html){ var el = document.getElementById(id); if(el) el.innerHTML = html || ''; }
  set('s-title', S.title); set('s-subtitle', S.subtitle);
  set('s-heroTitle', S.heroTitle); set('s-heroDesc', S.heroDesc);
  set('s-worksNote', S.worksNote); set('s-sourceTitle', S.sourceTitle);
  set('s-sourceText', S.sourceText); set('s-sourceFine', S.sourceFine);
  set('s-footerText', S.footerText);
  document.title = S.title || 'ShowcaseApp DIY 作品展';

  var tagsEl = document.getElementById('s-heroTags');
  (S.heroTags || '').split('|').filter(Boolean).forEach(function(t){
    var s = document.createElement('span'); s.textContent = t.trim(); tagsEl.appendChild(s);
  });

  /* ---------- 深浅色切换 ---------- */
  (function(){
    var btn = document.getElementById('theme-toggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('zk-theme', cur); }catch(e){}
    });
  })();

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var SVG = {
    heart:'<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
    bookmark:'<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>',
    left:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
    right:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>'
  };

  /* ================= 渲染帖子 ================= */
  var wrap = document.getElementById('posts');
  (D.works || []).forEach(function(w, wi){
    var media = (w.media && w.media.length) ? w.media : [];
    var n = Math.max(1, media.length);

    var slidesHTML = media.map(function(m){
      if(m.type === 'video'){
        return '<div class="ig-slide"><video src="' + esc(m.src) + '" controls preload="metadata" playsinline></video></div>';
      }
      if(m.type === 'text'){
        return '<div class="ig-slide"><img src="' + esc(m.src) + '" alt="' + esc(m.alt || w.title) + '"><div class="txt">' + esc(m.text || '') + '</div></div>';
      }
      return '<div class="ig-slide"><img src="' + esc(m.src) + '" alt="' + esc(m.alt || w.title) + '" draggable="false"></div>';
    }).join('');

    var segsHTML = media.map(function(_, i){ return '<div class="seg"><i></i></div>'; }).join('');
    var dotsHTML = media.map(function(_, i){ return '<i></i>'; }).join('');
    var bomHTML = (w.bom || []).map(function(b){
      return '<li><span>' + esc(b.name) + '</span><span>' + esc(b.qty) + '</span></li>';
    }).join('');
    var initials = String(w.author || w.title || '·').split(/\s+/).map(function(x){ return x[0]; }).slice(0, 2).join('');

    var el = document.createElement('article');
    el.className = 'post rise d' + Math.min(wi + 1, 3);
    el.innerHTML =
      '<header class="post-head">' +
        '<span class="avatar"><i><b>' + esc(initials) + '</b></i></span>' +
        '<div class="who"><p>' + esc(w.title) + '</p><p>' + esc(w.author || '') + (w.form ? ' · ' + esc(w.form) : '') + (w.id ? ' · ' + esc(w.id) : '') + (w.sample !== false ? ' · 示例' : '') + '</p></div>' +
      '</header>' +
      '<div class="ig-media" tabindex="0" role="region" aria-roledescription="carousel" aria-label="' + esc(w.title) + '：' + n + ' 张素材，左右方向键切换">' +
        '<div class="ig-track">' + slidesHTML + '</div>' +
        '<div class="ig-segs">' + segsHTML + '</div>' +
        '<div class="ig-count"><span class="num">1/' + n + '</span>' +
          (n > 1 ? '<button class="pp" aria-label="暂停自动播放">' + SVG.pause + '</button>' : '') +
        '</div>' +
        (n > 1 ? '<button class="ig-arrow prev" aria-label="上一张">' + SVG.left + '</button><button class="ig-arrow next" aria-label="下一张">' + SVG.right + '</button>' : '') +
      '</div>' +
      '<div class="ig-actions">' +
        '<button class="ig-btn like" aria-label="喜欢" aria-pressed="false">' + SVG.heart + '</button>' +
        '<div class="ig-dots">' + dotsHTML + '</div>' +
        '<button class="ig-btn save" aria-label="收藏" aria-pressed="false">' + SVG.bookmark + '</button>' +
      '</div>' +
      '<div class="ig-caption">' +
        '<div class="likes"><span class="cnt">' + (w.likes || 0) + '</span> 次喜欢</div>' +
        '<p class="cap"><b>' + esc(w.title) + '</b>' + esc(w.desc) + '</p>' +
        (bomHTML ? '<h5>硬件清单</h5><ul>' + bomHTML + '</ul>' : '') +
      '</div>';

    wrap.appendChild(el);
    initPost(el, w, media, n);
    adaptRatio(el, media);
  });

  /* 卡片比例自适应：跟随首个素材的原始宽高（横版出横卡、竖版出竖卡） */
  function adaptRatio(el, media){
    if(!media.length) return;
    var box = el.querySelector('.ig-media');
    var first = media[0];
    function apply(w, h){ if(w && h) box.style.aspectRatio = w + ' / ' + h; }
    if(first.type === 'video'){
      var v = el.querySelector('.ig-slide video');
      if(!v) return;
      if(v.videoWidth) apply(v.videoWidth, v.videoHeight);
      else v.addEventListener('loadedmetadata', function(){ apply(v.videoWidth, v.videoHeight); });
    }else{
      var img = el.querySelector('.ig-slide img');
      if(!img) return;
      if(img.naturalWidth) apply(img.naturalWidth, img.naturalHeight);
      else img.addEventListener('load', function(){ apply(img.naturalWidth, img.naturalHeight); });
    }
  }

  /* ================= 帖子交互 ================= */
  function initPost(el, w, media, n){
    var mediaBox = el.querySelector('.ig-media');
    var track = el.querySelector('.ig-track');
    var segs = el.querySelectorAll('.ig-segs .seg i');
    var dots = el.querySelectorAll('.ig-dots i');
    var num = el.querySelector('.ig-count .num');
    var likeBtn = el.querySelector('.like');
    var saveBtn = el.querySelector('.save');
    var cnt = el.querySelector('.cnt');
    var idx = 0, width = 0;
    var dragging = false, startX = 0, startOff = 0, lastX = 0, lastT = 0, vel = 0, panned = false;
    var x = 0, raf = null, animX = 0, animV = 0, animTarget = 0;
    var liked = false, saved = false;

    function measure(){ width = mediaBox.clientWidth; setX(-idx * width); }
    measure();
    window.addEventListener('resize', measure);

    function setX(px){ x = px; track.style.transform = 'translateX(' + px + 'px)'; }

    /* 弹簧（stiffness 320 / damping 26 / mass 0.8） */
    function springTo(target){
      animTarget = target;
      if(REDUCED){ setX(target); return; }
      if(raf) cancelAnimationFrame(raf);
      animX = x; animV = 0;
      var last = performance.now();
      (function step(now){
        var dt = Math.min((now - last) / 1000, 1 / 30); last = now;
        var acc = (-320 * (animX - animTarget) - 26 * animV) / 0.8;
        animV += acc * dt; animX += animV * dt;
        setX(animX);
        if(Math.abs(animX - animTarget) < 0.4 && Math.abs(animV) < 8){
          setX(animTarget); raf = null; return;
        }
        raf = requestAnimationFrame(step);
      })(last);
    }

    /* 状态同步 */
    function render(){
      num.textContent = (idx + 1) + '/' + n;
      segs.forEach(function(s, i){
        s.style.transform = 'scaleX(' + (i < idx ? 1 : i > idx ? 0 : 0) + ')';
      });
      if(autoPlay) segs[idx].style.transform = 'scaleX(' + progress + ')';
      dots.forEach(function(d, i){
        var dist = Math.abs(i - idx);
        var sc = dist === 0 ? 1.2 : dist === 1 ? .9 : dist === 2 ? .7 : .5;
        d.style.transform = 'scale(' + sc + ')';
        d.style.background = dist === 0 ? 'var(--accent)' : 'var(--dot)';
      });
      var prevA = el.querySelector('.ig-arrow.prev'), nextA = el.querySelector('.ig-arrow.next');
      if(prevA) prevA.classList.toggle('on', idx > 0);
      if(nextA) nextA.classList.toggle('on', idx < n - 1);
    }

    function go(to){
      idx = ((to % n) + n) % n;          /* 循环 */
      progress = 0;
      springTo(-idx * width);
      render();
    }

    /* ---- 拖拽（弹簧回弹） ---- */
    track.addEventListener('pointerdown', function(e){
      if(e.target.tagName === 'VIDEO') return;
      dragging = true; panned = false;
      startX = lastX = e.clientX; startOff = -idx * width; vel = 0; lastT = performance.now();
      track.classList.add('dragging');
      if(raf){ cancelAnimationFrame(raf); raf = null; }
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dx = e.clientX - startX;
      if(Math.abs(dx) > 4) panned = true;
      var edge = (idx === 0 && dx > 0) || (idx === n - 1 && dx < 0);
      setX(startOff + dx * (edge ? 0.3 : 1));          /* 越界阻尼 */
      var now = performance.now();
      if(now > lastT){ vel = (e.clientX - lastX) / (now - lastT) * 1000; lastX = e.clientX; lastT = now; }
    });
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      track.classList.remove('dragging');
      var dx = x - startOff;
      if(dx < -width * 0.18 || vel < -500) go(idx + 1);
      else if(dx > width * 0.18 || vel > 500) go(idx - 1);
      else springTo(-idx * width);
      setTimeout(function(){ panned = false; }, 0);
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);

    /* ---- 双击爱心 ---- */
    mediaBox.addEventListener('dblclick', function(e){
      if(panned || e.target.tagName === 'VIDEO') return;
      var r = mediaBox.getBoundingClientRect();
      var pop = document.createElement('div');
      pop.className = 'ig-heart-pop';
      pop.style.left = (e.clientX - r.left) + 'px';
      pop.style.top = (e.clientY - r.top) + 'px';
      pop.innerHTML = SVG.heart;
      mediaBox.appendChild(pop);
      requestAnimationFrame(function(){ pop.classList.add('play'); });
      setTimeout(function(){ pop.remove(); }, 900);
      setLike(true);
    });

    /* ---- 爱心/收藏 ---- */
    function setLike(v){
      if(liked === v) return;
      liked = v;
      likeBtn.classList.toggle('on', liked);
      likeBtn.classList.add('pop');
      likeBtn.setAttribute('aria-pressed', String(liked));
      cnt.textContent = String((w.likes || 0) + (liked ? 1 : 0));
      setTimeout(function(){ likeBtn.classList.remove('pop'); }, 340);
    }
    likeBtn.addEventListener('click', function(){ setLike(!liked); });
    saveBtn.addEventListener('click', function(){
      saved = !saved;
      saveBtn.classList.toggle('on', saved);
      saveBtn.classList.add('pop');
      saveBtn.setAttribute('aria-pressed', String(saved));
      setTimeout(function(){ saveBtn.classList.remove('pop'); }, 340);
    });

    /* ---- 箭头 / 键盘 ---- */
    var prevBtn = el.querySelector('.ig-arrow.prev'), nextBtn = el.querySelector('.ig-arrow.next');
    if(prevBtn) prevBtn.addEventListener('click', function(){ go(idx - 1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ go(idx + 1); });
    mediaBox.addEventListener('keydown', function(e){
      if(e.key === 'ArrowRight'){ go(idx + 1); e.preventDefault(); }
      else if(e.key === 'ArrowLeft'){ go(idx - 1); e.preventDefault(); }
      else if(e.key === 'Home'){ go(0); e.preventDefault(); }
      else if(e.key === 'End'){ go(n - 1); e.preventDefault(); }
    });

    /* ---- 自动播放（分段条填充；悬停/聚焦/拖拽/离屏暂停） ---- */
    var INTERVAL = 5000, autoPlay = n > 1, progress = 0, userPaused = false;
    var hover = false, focusIn = false, inView = true;
    var ppBtn = el.querySelector('.pp');
    if(ppBtn){
      ppBtn.addEventListener('click', function(){
        userPaused = !userPaused;
        ppBtn.innerHTML = userPaused ? SVG.play : SVG.pause;
        ppBtn.setAttribute('aria-label', userPaused ? '继续自动播放' : '暂停自动播放');
      });
    }
    mediaBox.addEventListener('pointerenter', function(e){ if(e.pointerType === 'mouse') hover = true; });
    mediaBox.addEventListener('pointerleave', function(){ hover = false; });
    mediaBox.addEventListener('focusin', function(){ focusIn = true; });
    mediaBox.addEventListener('focusout', function(){ focusIn = false; });
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ inView = es[0].isIntersecting; }, { rootMargin: '40px' })
        .observe(el);
    }
    var lastTick = performance.now();
    (function tick(now){
      var dt = now - lastTick; lastTick = now;
      if(autoPlay && !REDUCED && !userPaused && !hover && !focusIn && !dragging && inView && !document.hidden){
        progress += dt / INTERVAL;
        if(progress >= 1){ progress = 0; go(idx + 1 >= n ? 0 : idx + 1); }
        else segs[idx].style.transform = 'scaleX(' + progress + ')';
      }
      requestAnimationFrame(tick);
    })(lastTick);

    render();
  }
})();
</script>
</body>
</html>
